architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/RuOK.accesswidener")
}
repositories {
    maven { url "https://maven.shedaniel.me/" }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    compileOnly "maven.modrinth:cloth-config:${rootProject.cloth_config_version}+fabric"
    compileOnly "maven.modrinth:sodium:${rootProject.sodium_fabric_version}"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
