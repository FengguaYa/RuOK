name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (Fabric + NeoForge)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuOK-fabric
          path: fabric/build/libs/RuOK-*-fabric.jar

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: RuOK-neoforge
          path: neoforge/build/libs/RuOK-*-neoforge.jar
